name: 景氣循環儀表板

on:
  schedule:
    # 23:00 UTC 週一至週五 = 台北時間週二至週六早上 7:00
    # （UTC+8，故 UTC 當日 23:00 即為台北隔日 07:00）
    # 選這個時點的原因：美股 16:00 ET 收盤後約 3 小時，
    # FRED 當日利率與 Yahoo 收盤價皆已更新完畢。
    # 注意 GitHub 排程在尖峰時可能延遲數十分鐘，不保證準點。
    - cron: '0 23 * * 1-5'
  workflow_dispatch:        # 也可以隨時手動觸發

permissions:
  contents: write           # 需要寫回資料快取
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      # 面板快取不進版控：它 1.2MB、每天整檔重寫，版本庫會無止境長大。
      # 這份資料<b>完全可以重建</b>（FRED／Yahoo 都給完整歷史），
      # 真正不可重建的只有櫃買指數，那一份存在 data/twoii_history.csv
      # 並且有進版控。快取掉了最多就是這次跑慢一點。
      - name: 還原資料快取
        uses: actions/cache@v4
        with:
          path: |
            data/panel.csv.gz
            data/panel.projections.csv.gz
            data/panel.lastobs.csv.gz
          key: panel-${{ github.run_id }}
          restore-keys: panel-

      - name: 執行測試
        run: python -m pytest tests/ -q

      - name: 抓取資料並產生儀表板
        run: |
          mkdir -p site
          python run.py --cache data/panel.csv.gz --with-econ --with-macro \
            --fail-if-stale 5
          python run.py --offline --cache data/panel.csv.gz --profile macro \
            --macro site/index.html

      - name: 檢驗模型是否具備訊息量
        # 這是分析輸出，不該因為分析程式出錯就擋下儀表板
        continue-on-error: true
        run: python validate.py --cache data/panel.csv.gz

      - name: 寫回櫃買歷史種子檔
        # 只有這一份需要進版控：櫃買中心的 API 只給當月，
        # 今天沒存下來明天就補不回來。每天大約長 30 bytes。
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/twoii_history.csv
          if git diff --staged --quiet; then
            echo "櫃買歷史無新增，略過提交"
          else
            git commit -m "chore: 櫃買歷史 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  notify:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # 不寄 SMTP，也不把信箱寫進這個公開 repo。
      # 開 issue 之後 GitHub 會依帳號的通知設定寄信給 repo 擁有者。
      - name: 開啟失敗通知 issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `儀表板排程失敗 ${new Date().toISOString().slice(0,10)}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `排程在 ${new Date().toISOString()} 失敗。`,
              ``,
              `執行紀錄：${url}`,
              ``,
              `常見原因：`,
              `- 上游（FRED／Yahoo／櫃買中心）暫時不可用或擋住了請求`,
              `- 資料過舊觸發 --fail-if-stale 5 的關卡`,
              `- 相依套件更新導致測試失敗`,
              ``,
              `資料不會遺失：面板快取可以重建，櫃買歷史在 data/twoii_history.csv。`,
            ].join('\n');
            // 同一天重複失敗就補一則留言，不要洗版
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'scheduled-failure',
            });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: hit.number, body: `又失敗一次：${url}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['scheduled-failure'],
                assignees: [context.repo.owner],
              });
            }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
