name: 景氣循環儀表板

on:
  schedule:
    # 23:00 UTC 週一至週五 = 台北時間週二至週六早上 7:00
    # （UTC+8，故 UTC 當日 23:00 即為台北隔日 07:00）
    # 選這個時點的原因：美股 16:00 ET 收盤後約 3 小時，
    # FRED 當日利率與 Yahoo 收盤價皆已更新完畢。
    # 注意 GitHub 排程在尖峰時可能延遲數十分鐘，不保證準點。
    - cron: '0 23 * * 1-5'
  workflow_dispatch:        # 也可以隨時手動觸發

permissions:
  contents: write           # 需要寫回資料快取
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行測試
        run: python -m pytest tests/ -q

      - name: 抓取資料並產生儀表板
        run: |
          mkdir -p site
          python run.py --html site/index.html --cache data/panel.csv \
            --with-econ --with-macro
          python run.py --offline --cache data/panel.csv --profile macro \
            --macro site/macro.html

      - name: 檢驗模型是否具備訊息量
        # 這是分析輸出，不該因為分析程式出錯就擋下儀表板
        continue-on-error: true
        run: python validate.py --cache data/panel.csv

      - name: 寫回資料快取
        # 即使前面步驟失敗也要寫回：抓取本身可能已經成功，
        # 不該因為下游的程式錯誤就把辛苦抓到的歷史資料丟掉
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/panel.csv
          if git diff --staged --quiet; then
            echo "資料無變動，略過提交"
          else
            git commit -m "chore: 更新資料快取 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
